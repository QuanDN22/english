<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>English Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar" class="sidebar"></aside>

  <main class="content">
    <!-- Từ vựng -->
    <section id="words" class="panel">
      <div class="page-head">
        <p class="eyebrow">English Notebook</p>
        <h1>Từ vựng</h1>
      </div>
      <div class="words-layout">
        <div class="words-side">
          <form id="word-form" class="card">
            <h2>Thêm từ</h2>
            <input id="f-word" placeholder="Từ tiếng Anh (vd: resilient)" required>
            <input id="f-meaning" placeholder="Nghĩa (vd: kiên cường)" required>
            <input id="f-example" placeholder="Ví dụ (không bắt buộc)">
            <button type="submit">Thêm</button>
          </form>
          <div class="card">
            <h2>Sao lưu</h2>
            <p class="muted">Từ vựng chỉ lưu trong trình duyệt này. Xuất file để chuyển sang máy khác.</p>
            <div class="tools">
              <button id="export" type="button">Xuất file JSON</button>
              <label class="button">
                Nhập file JSON
                <input id="import" type="file" accept="application/json" hidden>
              </label>
            </div>
          </div>
        </div>
        <div>
          <div class="list-head">
            <input id="search" type="search" placeholder="Tìm từ...">
            <span id="count" class="muted"></span>
          </div>
          <ul id="word-list"></ul>
        </div>
      </div>
    </section>

    <!-- Flashcard -->
    <section id="cards" class="panel">
      <div class="page-head">
        <p class="eyebrow">English Notebook</p>
        <h1>Flashcard</h1>
        <p class="muted">Bấm vào thẻ để lật · phím ← → để chuyển thẻ · phím cách để lật</p>
      </div>
      <div class="flash-wrap">
        <p id="card-empty" class="muted">Chưa có từ nào. Hãy thêm từ ở mục Từ vựng.</p>
        <div id="card-area" hidden>
          <div id="card" title="Bấm để lật thẻ">
            <div id="card-front"></div>
            <div id="card-back" hidden></div>
          </div>
          <div class="card-actions">
            <button id="prev" type="button">← Trước</button>
            <button id="flip" type="button">Lật thẻ</button>
            <button id="next" type="button">Tiếp →</button>
          </div>
          <button id="shuffle" type="button">Xáo trộn</button>
          <p id="card-pos" class="muted"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
